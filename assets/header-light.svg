<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 170" width="1000" height="170" role="img" aria-label="Ishaan Nasir">
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    .cur{animation:blink 1.1s step-end infinite}
    @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    .in{animation:rise .6s ease-out both}
    .d1{animation-delay:.15s}.d2{animation-delay:.3s}
    @media (prefers-reduced-motion:reduce){.cur,.in{animation:none}}
  </style>
  <text x="0" y="30" class="mono in" font-size="15" fill="#59636e">~/ishaan-nasir</text>
  <text x="0" y="92" class="sans in d1" font-size="54" font-weight="650" letter-spacing="-1.5" fill="#1f2328">Ishaan Nasir<tspan class="cur" dx="6" font-weight="300" fill="#1a7f37">_</tspan></text>
  <text x="0" y="132" class="mono in d2" font-size="17" fill="#59636e">applied AI <tspan fill="#d1d9e0">/</tspan> financial infrastructure <tspan fill="#d1d9e0">/</tspan> voice agents <tspan fill="#d1d9e0">/</tspan> agent tooling</text>
  <line x1="0" y1="165" x2="1000" y2="165" stroke="#d1d9e0" stroke-width="1"/>
</svg>
