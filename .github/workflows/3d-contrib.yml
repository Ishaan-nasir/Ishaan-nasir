# OPTIONAL — 3D contribution graph.
#
# Install path: .github/workflows/3d-contrib.yml inside the PROFILE repo
# (Ishaan-nasir/Ishaan-nasir), then add this line to README.md where you want it:
#
#     <img src="profile-3d-contrib/profile-night-green.svg" width="100%" alt="contribution graph">
#
# Read this before installing:
#   - It renders YOUR real contribution data. The graph is dense from June 2026
#     onward and sparse before that, which in isometric view reads as a long flat
#     plain followed by a city. Look at the output before committing the README line.
#   - The "season" panel is used below deliberately: the full-year panels print
#     streak counters, and "current streak: 2 days" is not a stat worth publishing.
#   - Regenerates daily. It gets better every month without you touching it.
#
# To back out: delete this file and the <img> line. Nothing else depends on it.

name: 3D contribution graph

on:
  schedule:
    - cron: "7 12 * * *"    # 17:37 IST (off-peak minute; top-of-hour slots are the most contended and most often skipped)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Ishaan-nasir/github-profile-3d-contrib@839fa36715d227d4f72f1a8229d31a6ab3a71b3e # weeks-window
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: ""
          WEEKS: "13"

      - name: Remove star and fork counters
        run: python3 .github/scripts/strip_3d.py profile-3d-contrib/*.svg

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          git diff --staged --quiet || git commit -m "chore: regenerate 3d contribution graph"
          git push
