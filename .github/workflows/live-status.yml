# Checks each shipped site every 6 hours and redraws assets/live.svg.
# Sites are listed in .github/live/sites.json (5 rows fit the tile; the font
# covers lowercase letters, digits, dot and dash). To add a sixth, swap one out.

name: Live site status

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/live_tile.py
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/live.svg
          git diff --staged --quiet || git commit -m "chore: update live site status"
          git pull --rebase
          git push
